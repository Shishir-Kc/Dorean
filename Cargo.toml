[package]
name = "dorean"
version = "0.1.1"
edition = "2024"
description = "A pi/opencode-style coding agent for the terminal"
repository = "https://github.com/Shishir-Kc/Dorean"
license = "MIT"

[dependencies]
async-stream = "0.3"
async-trait = "0.1"
bytes = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
dirs = "6"
futures-util = "0.3"
glob = "0.3"
libc = "0.2"
rayon = "1"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "signal", "sync", "io-util"] }

[dev-dependencies]
wiremock = "0.6"

[profile.release]
lto = true
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
